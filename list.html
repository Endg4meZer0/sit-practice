<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <title>Рейтинг операционных систем</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 16px;
                line-height: 1.5;
                background: #f4f5f7;
                color: #222;
            }
            h1, h2 {
                margin: 0 0 10px;
            }
            .section {
                background: #fff;
                border: 1px solid #d0d4db;
                border-radius: 10px;
                padding: 18px;
                margin-bottom: 20px;
                box-shadow: 0 1px 4px rgba(0,0,0,.08);
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
            }
            .control {
                min-width: 220px;
                flex: 1 1 220px;
            }
            label {
                display: flex;
                flex-direction: column;
                gap: 6px;
                font-size: 0.95rem;
            }
            select, input {
                width: 100%;
                padding: 8px 10px;
                border: 1px solid #b3b9c9;
                border-radius: 6px;
                font-size: 0.95rem;
                box-sizing: border-box;
            }
            .chart-form {
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
            }
            .chart-card {
                border: 1px solid #d0d4db;
                border-radius: 10px;
                padding: 16px;
                background: #fbfcff;
                box-shadow: 0 1px 4px rgba(0,0,0,.05);
            }
            .chart-meta {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 12px;
                margin-bottom: 14px;
            }
            .chart-container {
                width: 100%;
                overflow-x: auto;
            }
            .chart-container svg {
                width: 100%;
                height: auto;
                display: block;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 12px;
            }
            th, td {
                border: 1px solid #d0d4db;
                padding: 10px 12px;
                text-align: left;
            }
            th {
                background: #eef1f7;
            }
            .pagination {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 16px;
            }
            .pagination button {
                padding: 8px 12px;
                border: 1px solid #95a1b3;
                background: #fff;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.95rem;
            }
            .pagination button.active {
                background: #2f6fdb;
                color: #fff;
                border-color: #2f6fdb;
            }
            .pagination button:disabled {
                opacity: 0.55;
                cursor: not-allowed;
            }
            footer {
                text-align: center;
                padding-top: 12px;
                color: #555;
            }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <script src="scripts/data.js"></script>
        <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
        <script src="scripts/list-react.js"></script>
    </body>
</html>
