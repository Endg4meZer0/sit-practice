<html>
    <head>
        <title>Рейтинг операционных систем</title>
    </head>
    <body>
        <header>
            <p>
                <a href="main.html">Операционные системы</a>
                <br />
                <a href="#"><b>Рейтинг операционных систем</b></a>
            </p>
            <hr />
        </header>
        
        <div class="viz-section">
            <button id="vizToggle" class="viz-toggle">
                ▼ Показать визуализацию
            </button>

            <div id="vizPanel" style="display:none;">
                <div class="viz-controls">

                    <div class="viz-control-group">
                        <label for="chartType">Тип диаграммы</label>
                        <select id="chartType">
                            <option value="bar">Столбчатая</option>
                            <option value="line">Линейная</option>
                            <option value="scatter">Точечная</option>
                        </select>
                    </div>

                    <div class="viz-control-group">
                        <label for="xField">Ось X</label>
                        <select id="xField">
                            <option value="family">Семья ОС</option>
                            <option value="name">Название ОС</option>
                        </select>
                    </div>

                    <div class="viz-control-group">
                        <label for="yField">Ось Y</label>
                        <select id="yField">
                            <option value="users">Кол-во установок</option>
                            <option value="sharePercent">Доля рынка</option>
                            <option value="sharePercentOS">
                                Доля внутри семьи ОС
                            </option>
                        </select>
                    </div>

                    <span id="vizCount" class="viz-count"></span>
                </div>

                <div id="vizLegend" class="viz-legend"></div>

                <svg id="vizChart"></svg>

                <div id="vizTooltip" class="viz-tooltip"></div>
            </div>
        </div>

        <details open="true">
            <summary>Фильтр</summary>
                <label>Семья ОС:
                    <select id="filterFamily">
                        <option value="all" selected>Все</option>
                        <option value="Windows">Windows</option>
                        <option value="Linux">Linux</option>
                        <option value="macOS">macOS</option>
                    </select>
                </label>
                <br/>
                <label
                    >Кол-во установок: от
                    <input type="input" id="filterUsers0" />
                    до
                    <input type="input" id="filterUsers1" />
                </label>
                <br />
                <label
                    >Доля рынка: от
                    <input type="input" id="filterSharePerc0" />
                    до
                    <input type="input" id="filterSharePerc1" />
                </label>
                <br />
                <label
                    >Доля рынка версии ОС: от
                    <input type="input" id="filterSharePercOS0" />
                    до
                    <input type="input" id="filterSharePercOS1" />
                </label>
                <br />
        </details>
        <details open="true">
            <summary>Сортировка</summary>
                <div class="sort-level">
                    <label>Первый уровень:
                        <select id="sort1Field">
                            <option value="none" selected>Нет</option>
                            <option value="users">Кол-во установок</option>
                            <option value="sharePercent">Доля использования</option>
                            <option value="sharePercentOS">Доля использования в семье ОС</option>
                        </select>
                        <select id="sort1Order">
                            <option value="asc" selected>По возрастанию</option>
                            <option value="desc">По убыванию</option>
                        </select>
                    </label>
                </div>
                <div class="sort-level">
                    <label>Второй уровень:
                        <select id="sort2Field">
                            <option value="none" selected>Нет</option>
                            <option value="users">Кол-во установок</option>
                            <option value="sharePercent">Доля использования</option>
                            <option value="sharePercentOS">Доля использования в семье ОС</option>
                        </select>
                        <select id="sort2Order">
                            <option value="asc" selected>По возрастанию</option>
                            <option value="desc">По убыванию</option>
                        </select>
                    </label>
                </div>
                <div class="sort-level">
                    <label>Третий уровень:
                        <select id="sort3Field">
                            <option value="none" selected>Нет</option>
                            <option value="users">Кол-во установок</option>
                            <option value="sharePercent">Доля использования</option>
                            <option value="sharePercentOS">Доля использования в семье ОС</option>
                        </select>
                        <select id="sort3Order">
                            <option value="asc" selected>По возрастанию</option>
                            <option value="desc">По убыванию</option>
                        </select>
                    </label>
                </div>
        </details>
        <table>
            <thead>
                <tr>
                    <th>Название</th>
                    <th>ОС</th>
                    <th>Кол-во установок</th>
                    <th>Доля использования</th>
                    <th>Доля использования в семье ОС</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>

        <script src="scripts/data.js"></script>
        <script src="scripts/list.js"></script>
        <script src="libs/d3.v7.js"></script>
        <script src="scripts/viz.js"></script>

        <footer>
            <hr />
            <p align="center">Тарасенко Т.В., Б9123-02.03.03тп/1</p>
        </footer>
    </body>
</html>
